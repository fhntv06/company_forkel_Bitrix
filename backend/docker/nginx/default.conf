
server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php index.html;

    charset utf-8;
    server_tokens off;

    client_max_body_size 64m;
    client_body_timeout 120s;
    send_timeout 120s;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Не отдаём скрытые файлы, кроме ACME challenge.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Запрещаем доступ к служебным файлам и резервным копиям.
    location ~* \.(?:ini|log|conf|sql|bak|old|orig|save|swp|dist)$ {
        deny all;
    }

    # Статические файлы отдаём напрямую.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|webp|ico|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Основная маршрутизация.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Передача PHP в PHP-FPM.
    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 600s;
        fastcgi_read_timeout 600s;
    }
}
