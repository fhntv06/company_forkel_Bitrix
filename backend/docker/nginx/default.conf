server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php index.html;

    charset utf-8;
    server_tokens off;

    client_max_body_size 64m;
    client_body_timeout 120s;
    send_timeout 120s;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Не отдаём скрытые файлы (.settings.php, .htaccess и т. п.), кроме ACME challenge.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Запрещаем доступ к служебным файлам и резервным копиям.
    location ~* \.(?:ini|log|conf|sql|bak|old|orig|save|swp|dist)$ {
        deny all;
    }

    # Запрещаем выполнение PHP в каталоге загрузок: туда попадают файлы пользователей.
    location ~* ^/upload/.*\.(?:php|php[0-9]|phtml|phar)$ {
        deny all;
    }

    # Сырой кеш Битрикса снаружи не нужен.
    location ~* ^/bitrix/(?:cache|managed_cache|local_cache|stack_cache|html_pages|backup)/ {
        deny all;
    }

    # Статические файлы отдаём напрямую.
    # Локальная разработка: кеширование отключено, иначе правки шаблона не видны до сброса кеша браузера.
    # Для production значение подбирается отдельно.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|webp|ico|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires off;
        access_log off;
    }

    # Основная маршрутизация. Несуществующие файлы и каталоги обрабатывает
    # обработчик ЧПУ Битрикса (/bitrix/urlrewrite.php), а не корневой index.php:
    # правила страниц (/catalog/, /personal/, /news/, /store/) заданы в urlrewrite.php.
    location / {
        try_files $uri $uri/ @bitrix;
    }

    location @bitrix {
        include fastcgi_params;
        fastcgi_pass php:9000;

        fastcgi_param SCRIPT_FILENAME $document_root/bitrix/urlrewrite.php;
        fastcgi_param SCRIPT_NAME /bitrix/urlrewrite.php;
        fastcgi_param DOCUMENT_ROOT $document_root;

        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 600s;
        fastcgi_read_timeout 600s;
    }

    # Передача PHP в PHP-FPM.
    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 600s;
        fastcgi_read_timeout 600s;
    }
}
