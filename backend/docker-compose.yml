services:
  nginx:
    image: nginx:1.28-alpine
    container_name: forkel-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - forkel

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: forkel-php
    restart: unless-stopped
    working_dir: /var/www/html
    # Пароль root MySQL в PHP-контейнер не передаётся: приложению нужны только данные его пользователя.
    environment:
      DB_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in backend/.env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in backend/.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in backend/.env}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-1}
    volumes:
      - ./www:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-forkel.ini:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - forkel


  db:
    image: mysql:8.0
    container_name: forkel-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in backend/.env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in backend/.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in backend/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in backend/.env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - forkel

networks:
  forkel:
    driver: bridge

volumes:
  mysql_data:
